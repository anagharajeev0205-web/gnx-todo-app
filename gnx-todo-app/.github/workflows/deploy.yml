name: Build Push Deploy

on:
  push:
    branches:
      - Main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Frontend
        run: |
          docker build -t anagharajeev18/gnx-frontend:$SHA ./frontend

      - name: Build Backend
        run: |
          docker build -t anagharajeev18/gnx-backend:$SHA ./backend

  push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        run: |
          docker build -t anagharajeev18/gnx-frontend:$SHA ./frontend
          docker push anagharajeev18/gnx-frontend:$SHA

      - name: Build and Push Backend
        run: |
          docker build -t anagharajeev18/gnx-backend:$SHA ./backend
          docker push anagharajeev18/gnx-backend:$SHA

  deploy:
    needs: push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Update Images
        run: |
          kubectl set image deployment/frontend frontend=anagharajeev18/gnx-frontend:$SHA -n gnx-app
          kubectl set image deployment/backend backend=anagharajeev18/gnx-backend:$SHA -n gnx-app

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/frontend -n gnx-app
          kubectl rollout status deployment/backend -n gnx-app